<div class="input-component" [ngClass]="getCompClass()">
    <div class="pos-relative" [ngClass]="getSelectionClass()">
        <input *ngIf="isMaskedAndFilled()" [value]="maskedValue" class="mask" name="mask" type="text" disabled="true">
        <input [value]="value" [ngStyle]="getTextStyle()" class="input" [ngClass]="getInputClass()"
            [placeholder]="placeholder" name="input" type="text" maxlength="128" (input)="onInput($event)"
            (focus)="onFocus()" (blur)="onBlur()" (keydown)="onDisallow($event)" (copy)="onPrevent($event)"
            (cut)="onPrevent($event)">
        <button aria-label="vis" class="vis-btn" [ngClass]="getIconClass()" type="button" [disabled]="isDisabled()"
            (click)="onToggle()"></button>
    </div>
    <div *ngIf="this.isError()" class="error-cont">
        <span class="error">{{ error }}</span>
    </div>
</div>
